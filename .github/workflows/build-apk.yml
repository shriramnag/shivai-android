name: Build ShivAI Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    name: Build ShivAI APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1. Checkout repository
      - name: Checkout ShivAI
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Verify Java
      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 4. Check Gradle wrapper
      - name: Check Gradle Wrapper
        run: |
          echo "Checking Gradle wrapper..."

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew is missing."
            exit 1
          fi

          chmod +x gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar is missing."
            echo "The Gradle wrapper JAR must be committed to the repository."
            exit 1
          fi

          echo "Gradle wrapper found."
          ls -la gradlew
          ls -la gradle/wrapper/

      # 5. Verify Gradle
      - name: Verify Gradle
        run: |
          ./gradlew --version

      # 6. Clean project
      - name: Clean Project
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # 7. Build Debug APK
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == null }}
        run: |
          echo "======================================"
          echo "Building ShivAI Debug APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # 8. Build Release APK
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: |
          echo "======================================"
          echo "Building ShivAI Release APK"
          echo "======================================"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      # 9. Show APK output
      - name: Find Generated APK
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          if [ ! -d "app/build/outputs/apk" ]; then
            echo "ERROR: APK output directory was not created."
            exit 1
          fi

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # 10. Collect APK
      - name: Collect APK Files
        run: |
          mkdir -p artifacts/apk

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp -v {} artifacts/apk/ \;

          echo "======================================"
          echo "COLLECTED APK"
          echo "======================================"

          ls -lh artifacts/apk/

      # 11. Upload APK
      - name: Upload ShivAI APK
        uses: actions/upload-artifact@v6
        with:
          name: ShivAI-v1.0.0-APK
          path: artifacts/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # 12. Run unit tests
      - name: Run Unit Tests
        id: unit_tests
        continue-on-error: true
        run: |
          echo "======================================"
          echo "Running ShivAI Unit Tests"
          echo "======================================"

          ./gradlew testDebugUnitTest \
            --no-daemon \
            --stacktrace

      # 13. Upload test reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ShivAI-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

      # 14. Test status
      - name: Test Status
        if: always()
        run: |
          if [ "${{ steps.unit_tests.outcome }}" = "success" ]; then
            echo "Unit tests PASSED."
          else
            echo "Unit tests FAILED."
            echo "APK build was attempted independently."
          fi

name: Build Shiv AI Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Checkout repository
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Set up Java Development Kit (JDK 17)
      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Setup Gradle 8.9 directly on PATH
      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Step 4: Accept Android SDK licenses for API 35
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # Step 5: Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 6: Build Debug APK directly
      - name: Build Debug APK
        run: |
          echo "Compiling Shiv AI Debug APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Step 7: Collect Output APK files
      - name: Collect Output APKs
        run: |
          mkdir -p artifacts/apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp -v {} artifacts/apk/ \;
          echo "=== Collected APK Artifacts ==="
          ls -lh artifacts/apk/

      # Step 8: Upload APK as downloadable Artifact
      - name: Upload APKs as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShivAI-v1.0.0-APK
          path: artifacts/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # Step 9: Run Unit Tests afterwards (won't block APK)
      - name: Run Unit Tests
        continue-on-error: true
        run: |
          echo "Running Shiv AI unit test suite..."
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # Step 10: Upload Test Reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

name: Build ShivAI Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    name: Build ShivAI APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1. Checkout
      - name: Checkout ShivAI
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Verify Java
      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 4. Check Gradle wrapper
      - name: Check Gradle Wrapper
        run: |
          echo "Checking Gradle wrapper..."

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew is missing."
            exit 1
          fi

          chmod +x gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar is missing."
            echo "Generating Gradle wrapper with Gradle 8.9..."

            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.9
            else
              echo "ERROR: Gradle is not available and wrapper JAR is missing."
              exit 1
            fi

            chmod +x gradlew
          fi

          echo "Gradle wrapper files:"
          ls -la gradlew
          ls -la gradle/wrapper/

      # 5. Verify Gradle 8.9
      - name: Verify Gradle
        run: |
          ./gradlew --version

      # 6. Clean build
      - name: Clean Project
        run: |
          ./gradlew clean --no-daemon --stacktrace

      # 7. Build Debug APK
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == null }}
        run: |
          echo "Building ShivAI Debug APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 8. Build Release APK
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: |
          echo "Building ShivAI Release APK..."
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 9. Find APK
      - name: Find Generated APK
        run: |
          echo "=== APK OUTPUT ==="

          if [ -d "app/build/outputs/apk" ]; then
            find app/build/outputs/apk -type f -name "*.apk" -print
          else
            echo "ERROR: APK output directory does not exist."
            exit 1
          fi

      # 10. Collect APK
      - name: Collect APK Files
        run: |
          mkdir -p artifacts/apk

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp -v {} artifacts/apk/ \;

          echo "=== ARTIFACTS ==="
          ls -lh artifacts/apk/

      # 11. Upload APK
      - name: Upload ShivAI APK
        uses: actions/upload-artifact@v4
        with:
          name: ShivAI-v1.0.0-APK
          path: artifacts/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # 12. Run unit tests AFTER APK build
      - name: Run Unit Tests
        id: unit_tests
        continue-on-error: true
        run: |
          echo "Running ShivAI unit tests..."
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # 13. Upload test reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShivAI-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

      # 14. Report test status
      - name: Test Result
        if: always()
        run: |
          if [ "${{ steps.unit_tests.outcome }}" = "success" ]; then
            echo "Unit tests PASSED."
          else
            echo "WARNING: Unit tests FAILED."
            echo "APK build was completed separately."
          fi

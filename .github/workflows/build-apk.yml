name: Build Shiv AI Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify Gradle Wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Verify Build Toolchain
        run: ./gradlew --version --no-daemon

      - name: Clean Project
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          echo "Compiling Shiv AI Debug APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Output APK files
        run: |
          set -e
          mkdir -p artifacts/apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp -v {} artifacts/apk/ \;
          test -n "$(find artifacts/apk -name '*.apk' -print -quit)"
          echo "=== Collected APK Artifacts ==="
          ls -lh artifacts/apk/

      - name: Upload APKs as GitHub Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ShivAI-debug-apk-${{ github.run_number }}
          path: artifacts/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
